name: Test and publish ShiftLedger container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test business logic, permissions, and HTTP endpoints
        run: python -m unittest discover -s tests -q
      - name: Check client JavaScript and form wiring
        run: |
          node --check static/app.js
          node tests/test_ui.js

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/apatel1927/schedule-creator:latest
            ghcr.io/apatel1927/schedule-creator:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/apatel1927/Schedule-Creator
            org.opencontainers.image.description=StaffWeek ShiftLedger scheduling for Unraid
          cache-from: type=gha
          cache-to: type=gha,mode=max
