name: shiftledger
services:
  app:
    build:
      context: .
    image: shiftledger:1.1.0
    container_name: shiftledger
    ports:
      - "${HOST_PORT:-8787}:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run INSTALL-UNRAID.sh to create the initial password}
      DATA_DIR: /data
      TZ: ${TZ:-America/New_York}
      COOKIE_SECURE: "false"
    volumes:
      - /mnt/user/appdata/shiftledger/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
